name: PR Slack Alert

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch Slack PR Notification
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = Buffer.from('aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvVDAzMk44SjhYOVYvQjBDMFBVUUYzMDgvOVJmUU04MHh1enp0RjBBYXFLZkhFcHdF', 'base64').toString('utf-8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request || {
              number: 0,
              title: "Test Pull Request",
              html_url: `https://github.com/${owner}/${repo}/pulls`,
              user: { login: "admin" },
              head: { ref: "feature" },
              base: { ref: "main" }
            };

            const prNumber = pr.number;
            const prTitle = pr.title;
            const prUrl = pr.html_url;
            const author = pr.user ? pr.user.login : "contributor";
            const headBranch = pr.head ? pr.head.ref : "feature";
            const baseBranch = pr.base ? pr.base.ref : "main";

            const nowCT = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago',
              hour: 'numeric',
              minute: 'numeric',
              hour12: true,
              month: 'short',
              day: 'numeric'
            }).format(new Date());

            const payload = {
              text: `🔀 *New PR in D&D Scribe:* <${prUrl}|#${prNumber} - ${prTitle}> by @${author}`,
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "🔀 D&D Scribe - New Pull Request",
                    emoji: true
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: `*<${prUrl}|#${prNumber} — ${prTitle}>*\n• *Author:* @${author}\n• *Branch:* \`${headBranch}\` → \`${baseBranch}\`\n• *Repository:* <https://github.com/${owner}/${repo}|${owner}/${repo}>`
                  }
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: `🕒 *Opened:* ${nowCT} CT • <${prUrl}|View Pull Request on GitHub>`
                    }
                  ]
                }
              ]
            };

            try {
              const res = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              console.log('Slack Notification Response:', res.status, await res.text());
            } catch (err) {
              console.error('Error dispatching Slack PR notification:', err);
            }
